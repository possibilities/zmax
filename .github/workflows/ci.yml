name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pin-transaction exercises smolmux's live Companion builder so drift
      # between the pin script and the consumer's builder is caught here.
      - uses: actions/checkout@v5
        with:
          repository: possibilities/smolmux
          path: smolmux
      - name: Validate repository contracts
        run: tests/validate.sh
        env:
          ZMAX_TEST_BUILD_COMPANION: ${{ github.workspace }}/smolmux/scripts/build-companion.sh
      - name: Check shell scripts
        run: shellcheck --severity=warning scripts/reconcile-branches.sh scripts/pin-companion.sh tests/validate.sh tests/pin-transaction.sh tests/fixtures/fake-zig.sh
